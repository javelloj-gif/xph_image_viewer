<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado radial para un núcleo solar sumamente brillante y radiante -->
    <radialGradient id="brightSun" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF8B3" />
      <stop offset="60%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#FF6A00" />
    </radialGradient>

    <!-- Cuerpo del Lente Filtro UV (Negro profundo/carbono con textura de vidrio óptico) -->
    <linearGradient id="uvLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242830" />
      <stop offset="50%" stop-color="#14161B" />
      <stop offset="100%" stop-color="#0A0B0D" />
    </linearGradient>

    <!-- Reflejo violeta/azul (Típico tratamiento antirreflejos de los filtros UV) -->
    <linearGradient id="uvReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Sombra suave para proyectar relieve en Windows sin necesidad de un fondo rígido -->
    <filter id="lensShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <!-- Resplandor de radiación solar intensa -->
    <filter id="solarGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- El fondo ahora es completamente transparente -->

  <!-- Sol radiante posicionado sobre la curva protectora -->
  <circle cx="315" cy="185" r="75" fill="url(#brightSun)" filter="url(#solarGlow)" />

  <!-- Cuerpo de lente protectora (Filtro UV) -->
  <path d="M 120,130
           Q 185,125 245,130
           C 270,132 272,255 315,255
           C 358,255 370,195 385,195
           Q 395,195 400,210
           L 395,350
           C 395,380 375,400 345,400
           H 167
           C 137,400 120,380 120,350
           Z"
        fill="url(#uvLens)"
        stroke="#2A2F3A"
        stroke-width="2"
        filter="url(#lensShadow)" />

  <!-- Brillo físico curvo sobre la superficie superior del lente -->
  <path d="M 125,140 C 180,135 235,140 250,150"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.3" />

  <!-- Capa reflectante superior (Simulación de recubrimiento químico del filtro) -->
  <path d="M 120,130
           Q 185,125 245,130
           C 270,132 272,255 315,255
           C 358,255 370,195 385,195
           L 360,250 
           C 340,290 280,280 230,220
           Z" 
        fill="url(#uvReflection)" />
</svg>